<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <title>2D Space Shooter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050510;
      font-family: 'Courier New', Courier, monospace;
      color: #fff;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      padding: 0.5rem;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      letter-spacing: 0.2em;
      color: #0ff;
      text-shadow: 0 0 10px #0ff;
    }

    #hud {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      font-size: 1.1rem;
    }

    #score {
      color: #ff0;
    }

    #lives {
      color: #f44;
    }

    #gameContainer {
      position: relative;
      width: 100%;
      max-width: 800px;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      border: 2px solid #333;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
      touch-action: none;
    }

    #gameOver {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.75);
    }

    #gameOver.visible {
      display: flex;
    }

    #gameOver h2 {
      font-size: 2.5rem;
      color: #f44;
      margin-bottom: 1rem;
      text-shadow: 0 0 15px #f44;
    }

    #finalScore {
      font-size: 1.3rem;
      margin-bottom: 1.5rem;
      color: #ff0;
    }

    #restartBtn {
      padding: 0.75rem 2rem;
      font-family: inherit;
      font-size: 1.1rem;
      background: #0ff;
      color: #000;
      border: none;
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: background 0.2s, transform 0.1s;
    }

    #restartBtn:hover {
      background: #0cc;
    }

    #restartBtn:active {
      transform: scale(0.97);
    }

    #instructions {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: #888;
      text-align: center;
      padding: 0 0.5rem;
    }

    #touchControls {
      display: none;
      width: 100%;
      max-width: 800px;
      margin-top: 0.75rem;
      gap: 0.75rem;
      align-items: stretch;
    }

    #touchControls.visible {
      display: flex;
    }

    .control-group {
      display: flex;
      gap: 0.5rem;
      flex: 1;
    }

    .control-btn {
      flex: 1;
      min-height: 64px;
      font-family: inherit;
      font-size: 1.4rem;
      font-weight: bold;
      color: #fff;
      background: rgba(0, 255, 255, 0.15);
      border: 2px solid #0ff;
      border-radius: 12px;
      cursor: pointer;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s, transform 0.1s;
    }

    .control-btn:active,
    .control-btn.active {
      background: rgba(0, 255, 255, 0.4);
      transform: scale(0.96);
    }

    #btnShoot {
      flex: 1.2;
      background: rgba(255, 68, 68, 0.2);
      border-color: #f44;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
    }

    #btnShoot:active,
    #btnShoot.active {
      background: rgba(255, 68, 68, 0.5);
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.1rem;
        margin-bottom: 0.25rem;
      }

      #hud {
        font-size: 0.95rem;
      }

      #gameOver h2 {
        font-size: 1.8rem;
      }

      #instructions {
        font-size: 0.75rem;
      }

      .control-btn {
        min-height: 56px;
      }
    }
  </style>
</head>
<body>
  <h1>SPACE SHOOTER</h1>
  <div id="hud">
    <span id="score">Score: 0</span>
    <span id="lives">Lives: 3</span>
  </div>
  <div id="gameContainer">
    <canvas id="game" width="800" height="600"></canvas>
    <div id="gameOver">
      <h2>GAME OVER</h2>
      <p id="finalScore">Score: 0</p>
      <button id="restartBtn">RESTART</button>
    </div>
  </div>
  <div id="touchControls">
    <div class="control-group">
      <button type="button" class="control-btn" id="btnLeft" aria-label="Move left">◀</button>
      <button type="button" class="control-btn" id="btnRight" aria-label="Move right">▶</button>
    </div>
    <button type="button" class="control-btn" id="btnShoot" aria-label="Shoot">FIRE</button>
  </div>
  <p id="instructions">Arrow Keys: Move &nbsp;|&nbsp; Space: Shoot</p>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const gameOverEl = document.getElementById('gameOver');
    const finalScoreEl = document.getElementById('finalScore');
    const restartBtn = document.getElementById('restartBtn');
    const touchControlsEl = document.getElementById('touchControls');
    const instructionsEl = document.getElementById('instructions');
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnShoot = document.getElementById('btnShoot');

    const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

    const CANVAS_W = 800;
    const CANVAS_H = 600;
    const PLAYER_SPEED = 5;
    const BULLET_SPEED = 8;
    const BULLET_COOLDOWN = 250;
    const ENEMY_SPAWN_INTERVAL = 1200;
    const SCORE_PER_KILL = 100;

    let state = 'playing';
    let score = 0;
    let lives = 3;
    let player = null;
    let bullets = [];
    let enemies = [];
    let particles = [];
    let stars = [];
    let keys = {};
    let touchInput = { left: false, right: false, shoot: false };
    let lastShot = 0;
    let lastSpawn = 0;
    let animationId = null;

    function createPlayer() {
      const width = 40;
      const height = 30;
      return {
        x: CANVAS_W / 2 - width / 2,
        y: CANVAS_H - height - 20,
        width,
        height,
        speed: PLAYER_SPEED
      };
    }

    function createStars() {
      stars = [];
      for (let i = 0; i < 80; i++) {
        stars.push({
          x: Math.random() * CANVAS_W,
          y: Math.random() * CANVAS_H,
          radius: Math.random() * 1.5 + 0.5,
          speed: Math.random() * 0.5 + 0.2
        });
      }
    }

    function spawnEnemy() {
      const radius = Math.random() * 12 + 14;
      enemies.push({
        x: Math.random() * (CANVAS_W - radius * 2) + radius,
        y: -radius,
        radius,
        speed: Math.random() * 2 + 2,
        color: Math.random() > 0.5 ? '#f44' : '#f80',
        shape: Math.random() > 0.5 ? 'circle' : 'square',
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.05
      });
    }

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI * 2 * i) / 6;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * 3,
          vy: Math.sin(angle) * 3,
          radius: 3,
          color,
          life: 20
        });
      }
    }

    function shoot() {
      const now = Date.now();
      if (now - lastShot < BULLET_COOLDOWN) return;
      lastShot = now;
      bullets.push({
        x: player.x + player.width / 2 - 2,
        y: player.y,
        width: 4,
        height: 12,
        speed: BULLET_SPEED
      });
    }

    function rectCircleCollide(rx, ry, rw, rh, cx, cy, cr) {
      const closestX = Math.max(rx, Math.min(cx, rx + rw));
      const closestY = Math.max(ry, Math.min(cy, ry + rh));
      const dx = cx - closestX;
      const dy = cy - closestY;
      return dx * dx + dy * dy < cr * cr;
    }

    function playerEnemyCollide(p, e) {
      return rectCircleCollide(p.x, p.y, p.width, p.height, e.x, e.y, e.radius);
    }

    function updateHUD() {
      scoreEl.textContent = `Score: ${score}`;
      livesEl.textContent = `Lives: ${lives}`;
    }

    function showGameOver() {
      state = 'gameOver';
      finalScoreEl.textContent = `Score: ${score}`;
      gameOverEl.classList.add('visible');
    }

    function update(timestamp) {
      if (state !== 'playing') return;

      if (keys['ArrowLeft'] || touchInput.left) {
        player.x = Math.max(0, player.x - player.speed);
      }
      if (keys['ArrowRight'] || touchInput.right) {
        player.x = Math.min(CANVAS_W - player.width, player.x + player.speed);
      }
      if (keys[' '] || touchInput.shoot) {
        shoot();
      }

      bullets = bullets.filter(b => {
        b.y -= b.speed;
        return b.y + b.height > 0;
      });

      if (timestamp - lastSpawn >= ENEMY_SPAWN_INTERVAL) {
        spawnEnemy();
        lastSpawn = timestamp;
      }

      enemies.forEach(e => {
        e.y += e.speed;
        e.rotation += e.rotSpeed;
      });

      for (let i = bullets.length - 1; i >= 0; i--) {
        for (let j = enemies.length - 1; j >= 0; j--) {
          const b = bullets[i];
          const e = enemies[j];
          if (rectCircleCollide(b.x, b.y, b.width, b.height, e.x, e.y, e.radius)) {
            spawnParticles(e.x, e.y, e.color);
            bullets.splice(i, 1);
            enemies.splice(j, 1);
            score += SCORE_PER_KILL;
            updateHUD();
            break;
          }
        }
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.y - e.radius > CANVAS_H) {
          enemies.splice(i, 1);
          lives--;
          updateHUD();
          if (lives <= 0) {
            showGameOver();
            return;
          }
        } else if (playerEnemyCollide(player, e)) {
          spawnParticles(e.x, e.y, e.color);
          enemies.splice(i, 1);
          lives--;
          updateHUD();
          if (lives <= 0) {
            showGameOver();
            return;
          }
        }
      }

      particles = particles.filter(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        p.radius *= 0.95;
        return p.life > 0;
      });

      stars.forEach(s => {
        s.y += s.speed;
        if (s.y > CANVAS_H) {
          s.y = 0;
          s.x = Math.random() * CANVAS_W;
        }
      });
    }

    function drawPlayer() {
      const { x, y, width, height } = player;
      ctx.fillStyle = '#0ff';
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + width / 2, y);
      ctx.lineTo(x + width, y + height);
      ctx.lineTo(x + width / 2, y + height - 8);
      ctx.lineTo(x, y + height);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    function drawBullets() {
      ctx.fillStyle = '#ff0';
      bullets.forEach(b => {
        ctx.fillRect(b.x, b.y, b.width, b.height);
      });
    }

    function drawEnemies() {
      enemies.forEach(e => {
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(e.rotation);
        ctx.fillStyle = e.color;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        if (e.shape === 'circle') {
          ctx.beginPath();
          ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        } else {
          ctx.fillRect(-e.radius, -e.radius, e.radius * 2, e.radius * 2);
          ctx.strokeRect(-e.radius, -e.radius, e.radius * 2, e.radius * 2);
        }
        ctx.restore();
      });
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.globalAlpha = p.life / 20;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      });
    }

    function drawBackground() {
      ctx.fillStyle = '#0a0a1a';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

      ctx.fillStyle = '#fff';
      stars.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function draw() {
      drawBackground();
      drawPlayer();
      drawBullets();
      drawEnemies();
      drawParticles();
    }

    function gameLoop(timestamp) {
      update(timestamp);
      draw();
      animationId = requestAnimationFrame(gameLoop);
    }

    function resetGame() {
      state = 'playing';
      score = 0;
      lives = 3;
      player = createPlayer();
      bullets = [];
      enemies = [];
      particles = [];
      lastShot = 0;
      lastSpawn = performance.now();
      gameOverEl.classList.remove('visible');
      updateHUD();
    }

    function bindTouchButton(btn, inputKey) {
      const press = (e) => {
        e.preventDefault();
        touchInput[inputKey] = true;
        btn.classList.add('active');
      };
      const release = (e) => {
        e.preventDefault();
        touchInput[inputKey] = false;
        btn.classList.remove('active');
      };

      btn.addEventListener('touchstart', press, { passive: false });
      btn.addEventListener('touchend', release, { passive: false });
      btn.addEventListener('touchcancel', release, { passive: false });
      btn.addEventListener('mousedown', press);
      btn.addEventListener('mouseup', release);
      btn.addEventListener('mouseleave', release);
    }

    function setupTouchDrag() {
      let activeTouchId = null;

      canvas.addEventListener('touchstart', (e) => {
        if (state !== 'playing' || activeTouchId !== null) return;
        e.preventDefault();
        const touch = e.changedTouches[0];
        activeTouchId = touch.identifier;
        movePlayerToTouch(touch.clientX);
      }, { passive: false });

      canvas.addEventListener('touchmove', (e) => {
        if (activeTouchId === null) return;
        e.preventDefault();
        for (const touch of e.changedTouches) {
          if (touch.identifier === activeTouchId) {
            movePlayerToTouch(touch.clientX);
            break;
          }
        }
      }, { passive: false });

      const endTouch = (e) => {
        for (const touch of e.changedTouches) {
          if (touch.identifier === activeTouchId) {
            activeTouchId = null;
            break;
          }
        }
      };

      canvas.addEventListener('touchend', endTouch, { passive: false });
      canvas.addEventListener('touchcancel', endTouch, { passive: false });
    }

    function movePlayerToTouch(clientX) {
      const rect = canvas.getBoundingClientRect();
      const ratio = CANVAS_W / rect.width;
      const canvasX = (clientX - rect.left) * ratio;
      player.x = Math.max(0, Math.min(CANVAS_W - player.width, canvasX - player.width / 2));
    }

    function init() {
      createStars();
      resetGame();

      if (isTouchDevice) {
        touchControlsEl.classList.add('visible');
        instructionsEl.textContent = 'Use on-screen buttons or drag ship on screen | FIRE to shoot';
        bindTouchButton(btnLeft, 'left');
        bindTouchButton(btnRight, 'right');
        bindTouchButton(btnShoot, 'shoot');
        setupTouchDrag();
      }

      document.addEventListener('keydown', (e) => {
        if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
          e.preventDefault();
        }
        keys[e.key] = true;
      });

      document.addEventListener('keyup', (e) => {
        keys[e.key] = false;
      });

      restartBtn.addEventListener('click', () => {
        resetGame();
      });

      document.addEventListener('contextmenu', (e) => {
        if (isTouchDevice) e.preventDefault();
      });

      if (animationId) cancelAnimationFrame(animationId);
      animationId = requestAnimationFrame(gameLoop);
    }

    init();
  </script>
</body>
</html>
